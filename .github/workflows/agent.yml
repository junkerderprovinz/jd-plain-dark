name: Event Scripter fix agent

# Builds the OPTIONAL jd-es-fix.jar add-on (see docs/event-scripter-fix.md). The theme itself
# is pure config and needs none of this; this only produces the small -javaagent that works
# around JDownloader's Event Scripter script-editor bug on FlatLaf dark themes.

on:
  push:
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build jd-es-fix.jar
        working-directory: agent
        run: |
          set -eux
          curl -sSL -o asm.jar https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar
          echo "8cadd43ac5eb6d09de05faecca38b917a040bb9139c7edeb4cc81c740b713281  asm.jar" | sha256sum -c -
          mkdir -p out
          find src -name '*.java' > sources.txt
          javac --release 21 -cp asm.jar -d out @sources.txt
          jar xf asm.jar org/objectweb/asm
          jar cfm jd-es-fix.jar manifest.mf -C out . org
          jar tf jd-es-fix.jar | grep -q EventScripterFixAgent

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jd-es-fix.jar
          path: agent/jd-es-fix.jar

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" agent/jd-es-fix.jar --clobber
