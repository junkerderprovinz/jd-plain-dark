name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate JSON
        run: |
          python - <<'EOF'
          import json, glob, sys
          files = glob.glob('theme/**/*.json', recursive=True)
          if not files:
              sys.exit('ERROR: no theme JSON files found under theme/ - glob matched nothing')
          for f in files:
              with open(f) as fh:
                  json.load(fh)
          print(f'JSON OK ({len(files)} file(s))')
          EOF

      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install/install.sh test/test-install.sh

      - name: Installer integration test
        run: sh test/test-install.sh

  installer-pwsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Behavioral test of install.ps1 (pwsh >= 6 path)
        shell: pwsh
        run: ./test/test-install.ps1

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Windows PowerShell 5.1 is what install.bat launches on a stock Windows box -
      # the environment that silently skipped the settings write (issue #11).
      - name: Behavioral test of install.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: .\test\test-install.ps1

      - name: Behavioral test of install.ps1 (PowerShell 7+)
        shell: pwsh
        run: .\test\test-install.ps1
