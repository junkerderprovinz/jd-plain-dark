name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          python -c "import json,glob; [json.load(open(f)) for f in glob.glob('theme/**/*.json', recursive=True)]; print('JSON OK')"

      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install/install.sh test/test-install.sh

      - name: Installer integration test
        run: sh test/test-install.sh
